name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Julia ${{ matrix.julia }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  coverage:
    name: Coverage threshold (>= 50%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v2
      - name: Run tests with coverage
        run: julia --color=yes --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test(coverage=true)'
      - name: Check coverage
        run: |
          julia -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add("Coverage")
            using Coverage
            cov = analyze_coverage("src")
            covered = sum(c.covered for c in cov)
            total = sum(c.covered + c.missed for c in cov)
            ratio = total > 0 ? covered / total : 0.0
            println("covered: $covered/$total ($(round(100 * ratio, digits=1))%)")
            ratio >= 0.5 || error("coverage below 50%")
          '

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
